name: Validate skills
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m unittest discover -s tests
      - run: python scripts/check_bundle.py
      - run: python scripts/release_audit.py
      - run: python -m build --wheel --no-isolation
        env:
          SOURCE_DATE_EPOCH: '1767225600'
      - run: python scripts/package_release.py --channel candidate
      - run: python scripts/verify_distribution.py
